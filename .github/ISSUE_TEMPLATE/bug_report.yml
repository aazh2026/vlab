name: Bug 报告 / Bug report
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你发现问题。请尽量给出**最小可复现**的步骤 —— 这让修复变得很快。

  - type: input
    id: version
    attributes:
      label: Python 版本 / Python version
      placeholder: "3.9 / 3.11 / 3.12 …"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 贴代码或命令
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果 / Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behaviour
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 请确认 / Please confirm
      options:
        - label: 我确认这是可复现的问题，不是一次性的网络/数据源抖动
          required: true
        - label: 我已确认这**不会**改变已有回测结论（若是，请说明）
