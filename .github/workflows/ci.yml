name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

  lint:
    name: byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile all modules
        run: python3 -m compileall -q src tests

  build-site:
    name: build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site into docs/
        run: |
          python3 -m pip install --quiet nothing 2>/dev/null || true
          python3 scripts/build_site.py
      - name: Verify site output exists
        run: |
          test -f docs/index.html
          test -f docs/report.json
          echo "site OK"
